<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda HC</title>
  <meta name="description" content="Minha agenda: calendário anual, planejamento do mês, objetivos e página do dia.">
  <meta name="theme-color" content="#262626">
  <link rel="manifest" href="manifest.webmanifest">

<body>
  <header class="appbar">

        <span>Hoje</span>
      </a>
      <a data-tab="mes" href="#/mes">

    <button id="sync" class="sync" type="button"></button>

  <button id="gbar" class="gbar" type="button" hidden><span></span><b>Toque para reconectar</b></button>
  <main id="app"></main>
  <dialog id="account" class="account" aria-label="Conta"><div class="acct-body"></div></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
